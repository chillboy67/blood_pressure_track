<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史记录 - 血压记录与追踪</title>
  <link rel="stylesheet" href="static/style.css">
  <script src="static/mock-data.js"></script>
  <script src="static/app.js" defer></script>
</head>
<body data-page="history">
<!-- NAV START -->
<header class="site-nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
      </span>
      血压记录
    </a>
    <nav class="nav-links">
      <a href="index.html" data-nav="index">首页</a>
      <a href="result.html" data-nav="result">结果页</a>
      <a href="history.html" data-nav="history">历史记录</a>
    </nav>
  </div>
</header>
<!-- NAV END -->
<main class="container">
  <section class="card">
    <h2 class="card-title">历史记录 <span class="sub" id="records-count"></span></h2>
    <!-- 筛选区 -->
    <div class="filters">
      <div class="field">
        <label for="filter-from">开始日期</label>
        <input type="date" id="filter-from">
      </div>
      <div class="field">
        <label for="filter-to">结束日期</label>
        <input type="date" id="filter-to">
      </div>
      <div class="field">
        <label for="filter-level">分级</label>
        <select id="filter-level">
          <option value="" selected>全部分级</option>
          <option value="low">低血压</option>
          <option value="normal">正常</option>
          <option value="high-normal">正常高值</option>
          <option value="grade1">1 级高血压</option>
          <option value="grade2">2 级高血压</option>
          <option value="grade3">3 级高血压</option>
        </select>
      </div>
      <button type="button" class="btn btn-ghost" id="filter-reset">重置</button>
      <span class="spacer"></span>
      <a class="btn btn-outline" href="/export">导出 CSV</a>
    </div>
    <!-- 记录表格（窄屏自动变为卡片式列表） -->
    <div class="table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th>测量时间</th>
            <th>收缩压</th>
            <th>舒张压</th>
            <th>脉搏</th>
            <th>部位</th>
            <th>分级</th>
            <th>备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
    <div class="empty-state" id="records-empty">没有符合条件的记录</div>
  </section>
</main>
<!-- FOOTER START -->
<footer class="site-footer">
  <p>本工具仅供记录参考，不能替代医生诊断。</p>
</footer>
<!-- FOOTER END -->
</body>
</html>
